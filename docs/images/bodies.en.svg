<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" role="img"><title>One engine, any body</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:1}.ln{fill:none;stroke-width:1.5;stroke:#8f877a}.dash{stroke-dasharray:5 4}.key{stroke:#f2b24e}.muted rect{stroke-dasharray:5 4}.tx{fill:#fbf8f2}.mu{fill:#c2b9ab}.am{fill:#f2b24e}.ct{stroke:#4d473f;fill:#232120}.spark{fill:none;stroke:#f2b24e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.code rect{fill:#2a2724;stroke:#4d473f}.code .ti{fill:#fbf8f2}.code .su{fill:#c2b9ab}.ext rect{fill:#33291a;stroke:#f2b24e}.ext .ti{fill:#f2b24e}.ext .su{fill:#e0cfae}.io rect{fill:#1d1b19;stroke:#4d473f}.io .ti{fill:#fbf8f2}.io .su{fill:#c2b9ab}.out rect{fill:#f2b24e;stroke:#f2b24e}.out .ti{fill:#1d1b19}.out .su{fill:#3a2e17}.muted rect{fill:#1d1b19;stroke:#4d473f}.muted .ti{fill:#c2b9ab}.muted .su{fill:#c2b9ab}</style><rect x="0" y="0" width="680" height="600" rx="16" fill="#1d1b19" stroke="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="code"><rect x="140" y="40" width="400" height="56" rx="12"/><text class="ti" x="340" y="59" text-anchor="middle" dominant-baseline="central">Body spec (declared by the rig)</text><text class="su" x="340" y="78" text-anchor="middle" dominant-baseline="central">Name · description · moves · list of parts</text></g><path class="ln" d="M250 96 L250 120 L190 120 L190 143" marker-end="url(#a)"/><path class="ln" d="M430 96 L430 120 L490 120 L490 143" marker-end="url(#a)"/><g class="code"><rect x="60" y="146" width="260" height="56" rx="12"/><text class="ti" x="190" y="165" text-anchor="middle" dominant-baseline="central">Judgment questions</text><text class="su" x="190" y="184" text-anchor="middle" dominant-baseline="central">Built from the spec, not the body</text></g><g class="code"><rect x="360" y="146" width="260" height="56" rx="12"/><text class="ti" x="490" y="165" text-anchor="middle" dominant-baseline="central">What the AI is told</text><text class="su" x="490" y="184" text-anchor="middle" dominant-baseline="central">"This is your body" (server → voice AI)</text></g><path class="ln" d="M190 202 L190 239" marker-end="url(#a)"/><path class="ln" d="M490 202 L490 239" marker-end="url(#a)"/><g class="ext"><rect x="60" y="242" width="260" height="56" rx="12"/><text class="ti" x="190" y="261" text-anchor="middle" dominant-baseline="central">Jev</text><text class="su" x="190" y="280" text-anchor="middle" dominant-baseline="central">Answers in body-neutral names</text></g><g class="ext"><rect x="360" y="242" width="260" height="56" rx="12"/><text class="ti" x="490" y="261" text-anchor="middle" dominant-baseline="central">Voice AI</text><text class="su" x="490" y="280" text-anchor="middle" dominant-baseline="central">"Okay, all the way right!"</text></g><path class="ln key" d="M360 270 L323 270" marker-end="url(#a)"/><text class="sm am" x="340" y="258" text-anchor="middle" dominant-baseline="central">line</text><path class="ln" d="M190 298 L190 320 L340 320 L340 341" marker-end="url(#a)"/><g class="out"><rect x="140" y="344" width="400" height="56" rx="12"/><text class="ti" x="340" y="363" text-anchor="middle" dominant-baseline="central">Expression frame</text><text class="su" x="340" y="382" text-anchor="middle" dominant-baseline="central">Feelings · move.right · per-part values</text></g><path class="ln" d="M340 400 L340 424 L150 424 L150 445" marker-end="url(#a)"/><path class="ln" d="M340 400 L340 445" marker-end="url(#a)"/><path class="ln" d="M340 424 L530 424 L530 445" marker-end="url(#a)"/><g class="code"><rect x="60" y="448" width="180" height="56" rx="12"/><text class="ti" x="150" y="467" text-anchor="middle" dominant-baseline="central">Face rigs</text><text class="su" x="150" y="486" text-anchor="middle" dominant-baseline="central">ARKit 52, head turn</text></g><g class="code"><rect x="250" y="448" width="180" height="56" rx="12"/><text class="ti" x="340" y="467" text-anchor="middle" dominant-baseline="central">Dog rig</text><text class="su" x="340" y="486" text-anchor="middle" dominant-baseline="central">Face + ears</text></g><g class="code"><rect x="440" y="448" width="180" height="56" rx="12"/><text class="ti" x="530" y="467" text-anchor="middle" dominant-baseline="central">Robot arm rig</text><text class="su" x="530" y="486" text-anchor="middle" dominant-baseline="central">Joints, claw, light</text></g><rect class="ct" x="40" y="530" width="600" height="46" rx="16" stroke-dasharray="5 4"/><text class="sm tx" x="340" y="553" text-anchor="middle" dominant-baseline="central">A new body = one spec + one rig. Engine, server and app code stay as they are.</text></svg>
