<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" height="630" role="img"><title>How an expression is judged</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:1}.ln{fill:none;stroke-width:1.5;stroke:#8f877a}.dash{stroke-dasharray:5 4}.key{stroke:#f2b24e}.muted rect{stroke-dasharray:5 4}.tx{fill:#fbf8f2}.mu{fill:#c2b9ab}.am{fill:#f2b24e}.ct{stroke:#4d473f;fill:#232120}.spark{fill:none;stroke:#f2b24e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.code rect{fill:#2a2724;stroke:#4d473f}.code .ti{fill:#fbf8f2}.code .su{fill:#c2b9ab}.ext rect{fill:#33291a;stroke:#f2b24e}.ext .ti{fill:#f2b24e}.ext .su{fill:#e0cfae}.io rect{fill:#1d1b19;stroke:#4d473f}.io .ti{fill:#fbf8f2}.io .su{fill:#c2b9ab}.out rect{fill:#f2b24e;stroke:#f2b24e}.out .ti{fill:#1d1b19}.out .su{fill:#3a2e17}.muted rect{fill:#1d1b19;stroke:#4d473f}.muted .ti{fill:#c2b9ab}.muted .su{fill:#c2b9ab}</style><rect x="0" y="0" width="680" height="630" rx="16" fill="#1d1b19" stroke="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="io"><rect x="60" y="40" width="240" height="56" rx="12"/><text class="ti" x="180" y="59" text-anchor="middle" dominant-baseline="central">AI reply text chunks</text><text class="su" x="180" y="78" text-anchor="middle" dominant-baseline="central">Drives the speaking face</text></g><g class="io"><rect x="380" y="40" width="240" height="56" rx="12"/><text class="ti" x="500" y="59" text-anchor="middle" dominant-baseline="central">User speech text</text><text class="su" x="500" y="78" text-anchor="middle" dominant-baseline="central">Drives the listening face</text></g><g class="code"><rect x="60" y="136" width="240" height="56" rx="12"/><text class="ti" x="180" y="155" text-anchor="middle" dominant-baseline="central">Split into clauses</text><text class="su" x="180" y="174" text-anchor="middle" dominant-baseline="central">Sentence end, comma, 40 chars</text></g><g class="code"><rect x="380" y="136" width="240" height="56" rx="12"/><text class="ti" x="500" y="155" text-anchor="middle" dominant-baseline="central">Re-judge as words arrive</text><text class="su" x="500" y="174" text-anchor="middle" dominant-baseline="central">Every 10 new chars, one at a time</text></g><g class="code"><rect x="60" y="232" width="240" height="56" rx="12"/><text class="ti" x="180" y="251" text-anchor="middle" dominant-baseline="central">Short clauses wait</text><text class="su" x="180" y="270" text-anchor="middle" dominant-baseline="central">4 chars or less: wait for 12 more</text></g><path class="ln" d="M180 96 L180 133" marker-end="url(#a)"/><path class="ln" d="M500 96 L500 133" marker-end="url(#a)"/><path class="ln" d="M180 192 L180 229" marker-end="url(#a)"/><path class="ln" d="M180 288 L180 337" marker-end="url(#a)"/><path class="ln" d="M500 192 L500 337" marker-end="url(#a)"/><g class="ext"><rect x="140" y="340" width="400" height="56" rx="12"/><text class="ti" x="340" y="359" text-anchor="middle" dominant-baseline="central">Ask Jev (one request per clause)</text><text class="su" x="340" y="378" text-anchor="middle" dominant-baseline="central">Last 4 lines · 2 prior clauses · clause · what follows</text></g><path class="ln" d="M340 396 L340 433" marker-end="url(#a)"/><g class="ext"><rect x="140" y="436" width="400" height="56" rx="12"/><text class="ti" x="340" y="455" text-anchor="middle" dominant-baseline="central">Option probabilities per part + intensity</text><text class="su" x="340" y="474" text-anchor="middle" dominant-baseline="central">Brows · eyes · gaze · cheeks · mouth · head · move</text></g><path class="ln" d="M340 492 L340 529" marker-end="url(#a)"/><g class="out"><rect x="140" y="532" width="400" height="56" rx="12"/><text class="ti" x="340" y="551" text-anchor="middle" dominant-baseline="central">Turn into action weights</text><text class="su" x="340" y="570" text-anchor="middle" dominant-baseline="central">Drop at 20% or less · full at 70% or more · × intensity</text></g></svg>
