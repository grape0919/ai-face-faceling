<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" height="630" role="img"><title>How an expression is judged</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:0.6}.ln{fill:none;stroke-width:1.3}.dash{stroke-dasharray:4 3;stroke-width:0.9}.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .ti{fill:#3C3489}.purple .su{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .ti{fill:#085041}.teal .su{fill:#0F6E56}.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .ti{fill:#444441}.gray .su{fill:#5F5E5A}.ln{stroke:#73726c}.tx{fill:#2C2C2A}.mu{fill:#5F5E5A}.ct{stroke:#B4B2A9}@media (prefers-color-scheme:dark){.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .ti{fill:#CECBF6}.purple .su{fill:#AFA9EC}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .ti{fill:#9FE1CB}.teal .su{fill:#5DCAA5}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .ti{fill:#D3D1C7}.gray .su{fill:#B4B2A9}.ln{stroke:#9c9a92}.tx{fill:#D3D1C7}.mu{fill:#B4B2A9}.ct{stroke:#5F5E5A}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="gray"><rect x="60" y="40" width="240" height="56" rx="8"/><text class="ti" x="180" y="59" text-anchor="middle" dominant-baseline="central">AI reply text chunks</text><text class="su" x="180" y="78" text-anchor="middle" dominant-baseline="central">Drives the speaking face</text></g><g class="gray"><rect x="380" y="40" width="240" height="56" rx="8"/><text class="ti" x="500" y="59" text-anchor="middle" dominant-baseline="central">User speech text</text><text class="su" x="500" y="78" text-anchor="middle" dominant-baseline="central">Drives the listening face</text></g><g class="teal"><rect x="60" y="136" width="240" height="56" rx="8"/><text class="ti" x="180" y="155" text-anchor="middle" dominant-baseline="central">Split into clauses</text><text class="su" x="180" y="174" text-anchor="middle" dominant-baseline="central">Sentence end, comma, 40 chars</text></g><g class="teal"><rect x="380" y="136" width="240" height="56" rx="8"/><text class="ti" x="500" y="155" text-anchor="middle" dominant-baseline="central">Re-judge as words arrive</text><text class="su" x="500" y="174" text-anchor="middle" dominant-baseline="central">Every 10 new chars, one at a time</text></g><g class="teal"><rect x="60" y="232" width="240" height="56" rx="8"/><text class="ti" x="180" y="251" text-anchor="middle" dominant-baseline="central">Short clauses wait</text><text class="su" x="180" y="270" text-anchor="middle" dominant-baseline="central">4 chars or less: wait for 12 more</text></g><path class="ln" d="M180 96 L180 133" marker-end="url(#a)"/><path class="ln" d="M500 96 L500 133" marker-end="url(#a)"/><path class="ln" d="M180 192 L180 229" marker-end="url(#a)"/><path class="ln" d="M180 288 L180 337" marker-end="url(#a)"/><path class="ln" d="M500 192 L500 337" marker-end="url(#a)"/><g class="purple"><rect x="140" y="340" width="400" height="56" rx="8"/><text class="ti" x="340" y="359" text-anchor="middle" dominant-baseline="central">Ask Jev (7 questions per request)</text><text class="su" x="340" y="378" text-anchor="middle" dominant-baseline="central">Last 4 lines · 2 prior clauses · clause · what follows</text></g><path class="ln" d="M340 396 L340 433" marker-end="url(#a)"/><g class="purple"><rect x="140" y="436" width="400" height="56" rx="8"/><text class="ti" x="340" y="455" text-anchor="middle" dominant-baseline="central">Probabilities for 6 face parts + intensity</text><text class="su" x="340" y="474" text-anchor="middle" dominant-baseline="central">Brows · eyes · gaze · cheeks · mouth · head</text></g><path class="ln" d="M340 492 L340 529" marker-end="url(#a)"/><g class="teal"><rect x="140" y="532" width="400" height="56" rx="8"/><text class="ti" x="340" y="551" text-anchor="middle" dominant-baseline="central">Turn into action weights</text><text class="su" x="340" y="570" text-anchor="middle" dominant-baseline="central">Drop at 20% or less · full at 70% or more · × intensity</text></g></svg>
