<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" height="630" role="img"><title>표정 시각 맞추기와 레이어 합성</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:1}.ln{fill:none;stroke-width:1.5;stroke:#8f877a}.dash{stroke-dasharray:5 4}.key{stroke:#f2b24e}.muted rect{stroke-dasharray:5 4}.tx{fill:#fbf8f2}.mu{fill:#c2b9ab}.am{fill:#f2b24e}.ct{stroke:#4d473f;fill:#232120}.spark{fill:none;stroke:#f2b24e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.code rect{fill:#2a2724;stroke:#4d473f}.code .ti{fill:#fbf8f2}.code .su{fill:#c2b9ab}.ext rect{fill:#33291a;stroke:#f2b24e}.ext .ti{fill:#f2b24e}.ext .su{fill:#e0cfae}.io rect{fill:#1d1b19;stroke:#4d473f}.io .ti{fill:#fbf8f2}.io .su{fill:#c2b9ab}.out rect{fill:#f2b24e;stroke:#f2b24e}.out .ti{fill:#1d1b19}.out .su{fill:#3a2e17}.muted rect{fill:#1d1b19;stroke:#4d473f}.muted .ti{fill:#c2b9ab}.muted .su{fill:#c2b9ab}</style><rect x="0" y="0" width="680" height="630" rx="16" fill="#1d1b19" stroke="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="code"><rect x="140" y="40" width="400" height="56" rx="12"/><text class="ti" x="340" y="59" text-anchor="middle" dominant-baseline="central">그 절이 소리로 나올 시각 추정</text><text class="su" x="340" y="78" text-anchor="middle" dominant-baseline="central">재생 시작 + 앞 글자 수 × 글자당 시간 + 쉼</text></g><path class="ln" d="M340 96 L340 120 L150 120 L150 147" marker-end="url(#a)"/><path class="ln" d="M340 96 L340 147" marker-end="url(#a)"/><path class="ln" d="M340 120 L530 120 L530 147" marker-end="url(#a)"/><g class="code"><rect x="60" y="150" width="180" height="56" rx="12"/><text class="ti" x="150" y="169" text-anchor="middle" dominant-baseline="central">판단이 먼저 옴</text><text class="su" x="150" y="188" text-anchor="middle" dominant-baseline="central">소리 시각에 건다</text></g><g class="code"><rect x="250" y="150" width="180" height="56" rx="12"/><text class="ti" x="340" y="169" text-anchor="middle" dominant-baseline="central">소리 도중에 옴</text><text class="su" x="340" y="188" text-anchor="middle" dominant-baseline="central">도착 즉시 건다</text></g><g class="muted"><rect x="440" y="150" width="180" height="56" rx="12"/><text class="ti" x="530" y="169" text-anchor="middle" dominant-baseline="central">이미 지나감</text><text class="su" x="530" y="188" text-anchor="middle" dominant-baseline="central">버린다</text></g><path class="ln" d="M150 206 L150 228 L340 228 L340 247" marker-end="url(#a)"/><path class="ln" d="M340 206 L340 247" marker-end="url(#a)"/><rect class="ct" x="60" y="250" width="560" height="262" rx="16" stroke-dasharray="5 4"/><text class="big tx" x="80" y="274" text-anchor="start" dominant-baseline="central">매 프레임 레이어 합성</text><g class="code"><rect x="80" y="296" width="520" height="34" rx="8"/><text class="ti" x="100" y="313" dominant-baseline="central">부위별 동작</text><text class="su" x="240" y="313" dominant-baseline="central">Jev 의 선택. 눈썹은 빠르게, 입꼬리는 천천히</text></g><g class="code"><rect x="80" y="338" width="520" height="34" rx="8"/><text class="ti" x="100" y="355" dominant-baseline="central">턴 상태</text><text class="su" x="240" y="355" dominant-baseline="central">듣는 중 · 생각 중 · 말하는 중의 기본 자세</text></g><g class="code"><rect x="80" y="380" width="520" height="34" rx="8"/><text class="ti" x="100" y="397" dominant-baseline="central">순간 동작</text><text class="su" x="240" y="397" dominant-baseline="central">끄덕임, 가로젓기, 말 시작할 때 눈썹 들썩</text></g><g class="code"><rect x="80" y="422" width="520" height="34" rx="8"/><text class="ti" x="100" y="439" dominant-baseline="central">립싱크</text><text class="su" x="240" y="439" dominant-baseline="central">말하는 동안 입은 소리가 우선</text></g><g class="code"><rect x="80" y="464" width="520" height="34" rx="8"/><text class="ti" x="100" y="481" dominant-baseline="central">깜빡임</text><text class="su" x="240" y="481" dominant-baseline="central">2.5~5.5초 간격, 미세한 머리 흔들림</text></g><path class="ln" d="M340 512 L340 549" marker-end="url(#a)"/><g class="out"><rect x="190" y="552" width="300" height="56" rx="12"/><text class="ti" x="340" y="571" text-anchor="middle" dominant-baseline="central">표현 프레임</text><text class="su" x="340" y="590" text-anchor="middle" dominant-baseline="central">얼굴: ARKit 52 · 로봇팔: 관절 각도</text></g></svg>
