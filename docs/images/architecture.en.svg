<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="680" height="520" role="img"><title>Faceling architecture</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:0.6}.ln{fill:none;stroke-width:1.3}.dash{stroke-dasharray:4 3;stroke-width:0.9}.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .ti{fill:#3C3489}.purple .su{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .ti{fill:#085041}.teal .su{fill:#0F6E56}.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .ti{fill:#444441}.gray .su{fill:#5F5E5A}.ln{stroke:#73726c}.tx{fill:#2C2C2A}.mu{fill:#5F5E5A}.ct{stroke:#B4B2A9}@media (prefers-color-scheme:dark){.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .ti{fill:#CECBF6}.purple .su{fill:#AFA9EC}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .ti{fill:#9FE1CB}.teal .su{fill:#5DCAA5}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .ti{fill:#D3D1C7}.gray .su{fill:#B4B2A9}.ln{stroke:#9c9a92}.tx{fill:#D3D1C7}.mu{fill:#B4B2A9}.ct{stroke:#5F5E5A}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="purple"><rect x="40" y="40" width="180" height="56" rx="8"/><text class="ti" x="130" y="59" text-anchor="middle" dominant-baseline="central">OpenAI Realtime</text><text class="su" x="130" y="78" text-anchor="middle" dominant-baseline="central">Voice conversation</text></g><g class="purple"><rect x="250" y="40" width="180" height="56" rx="8"/><text class="ti" x="340" y="59" text-anchor="middle" dominant-baseline="central">OpenAI transcription</text><text class="su" x="340" y="78" text-anchor="middle" dominant-baseline="central">Words mid-speech</text></g><g class="purple"><rect x="460" y="40" width="180" height="56" rx="8"/><text class="ti" x="550" y="59" text-anchor="middle" dominant-baseline="central">Jev</text><text class="su" x="550" y="78" text-anchor="middle" dominant-baseline="central">Judges each part</text></g><g class="teal"><rect x="460" y="140" width="180" height="56" rx="8"/><text class="ti" x="550" y="159" text-anchor="middle" dominant-baseline="central">Local server</text><text class="su" x="550" y="178" text-anchor="middle" dominant-baseline="central">Holds keys, relays Jev</text></g><path class="ln" d="M550 140 L550 99" marker-end="url(#a)" marker-start="url(#a)"/><path class="ln dash" d="M460 168 L340 168 L340 99" marker-end="url(#a)"/><path class="ln dash" d="M340 168 L180 168 L180 99" marker-end="url(#a)"/><text class="sm mu" x="400" y="156" text-anchor="middle" dominant-baseline="central">Ephemeral key</text><rect class="ct" x="40" y="230" width="600" height="230" rx="16" fill="none" stroke-dasharray="6 4"/><text class="big tx" x="620" y="256" text-anchor="end" dominant-baseline="central">Browser</text><g class="teal"><rect x="60" y="290" width="170" height="56" rx="8"/><text class="ti" x="145" y="309" text-anchor="middle" dominant-baseline="central">Adapter</text><text class="su" x="145" y="328" text-anchor="middle" dominant-baseline="central">Call events → engine</text></g><g class="teal"><rect x="255" y="290" width="170" height="56" rx="8"/><text class="ti" x="340" y="309" text-anchor="middle" dominant-baseline="central">Expression engine</text><text class="su" x="340" y="328" text-anchor="middle" dominant-baseline="central">Clauses, timing, frame</text></g><g class="teal"><rect x="450" y="290" width="170" height="56" rx="8"/><text class="ti" x="535" y="309" text-anchor="middle" dominant-baseline="central">Body (rig)</text><text class="su" x="535" y="328" text-anchor="middle" dominant-baseline="central">Face, dog, robot arm</text></g><path class="ln" d="M230 318 L252 318" marker-end="url(#a)"/><path class="ln" d="M425 318 L447 318" marker-end="url(#a)"/><path class="ln" d="M110 290 L110 99" marker-end="url(#a)" marker-start="url(#a)"/><text class="sm mu" x="118" y="204" text-anchor="start" dominant-baseline="central">WebRTC</text><path class="ln" d="M200 290 L200 212 L300 212 L300 99" marker-end="url(#a)"/><path class="ln" d="M380 290 L380 216 L550 216 L550 199" marker-end="url(#a)" marker-start="url(#a)"/><g class="gray"><rect x="60" y="380" width="170" height="56" rx="8"/><text class="ti" x="145" y="399" text-anchor="middle" dominant-baseline="central">Microphone</text><text class="su" x="145" y="418" text-anchor="middle" dominant-baseline="central">User's voice</text></g><g class="gray"><rect x="255" y="380" width="170" height="56" rx="8"/><text class="ti" x="340" y="399" text-anchor="middle" dominant-baseline="central">Speaker</text><text class="su" x="340" y="418" text-anchor="middle" dominant-baseline="central">AI voice, mouth shape</text></g><path class="ln" d="M145 380 L145 349" marker-end="url(#a)"/><path class="ln" d="M205 346 L205 362 L300 362 L300 377" marker-end="url(#a)"/><path class="ln" d="M425 408 L535 408 L535 349" marker-end="url(#a)"/><g class="purple"><rect x="60" y="484" width="14" height="14" rx="3"/></g><text class="sm mu" x="82" y="491" text-anchor="start" dominant-baseline="central">External service</text><g class="teal"><rect x="200" y="484" width="14" height="14" rx="3"/></g><text class="sm mu" x="222" y="491" text-anchor="start" dominant-baseline="central">Code in this repo</text><path class="ln dash" d="M350 491 L390 491"/><text class="sm mu" x="398" y="491" text-anchor="start" dominant-baseline="central">Ephemeral key (real keys stay on server)</text></svg>
