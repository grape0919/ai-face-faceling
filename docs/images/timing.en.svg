<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 630" width="680" height="630" role="img"><title>Timing and layer compositing</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:0.6}.ln{fill:none;stroke-width:1.3}.dash{stroke-dasharray:4 3;stroke-width:0.9}.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .ti{fill:#3C3489}.purple .su{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .ti{fill:#085041}.teal .su{fill:#0F6E56}.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .ti{fill:#444441}.gray .su{fill:#5F5E5A}.ln{stroke:#73726c}.tx{fill:#2C2C2A}.mu{fill:#5F5E5A}.ct{stroke:#B4B2A9}@media (prefers-color-scheme:dark){.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .ti{fill:#CECBF6}.purple .su{fill:#AFA9EC}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .ti{fill:#9FE1CB}.teal .su{fill:#5DCAA5}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .ti{fill:#D3D1C7}.gray .su{fill:#B4B2A9}.ln{stroke:#9c9a92}.tx{fill:#D3D1C7}.mu{fill:#B4B2A9}.ct{stroke:#5F5E5A}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="teal"><rect x="140" y="40" width="400" height="56" rx="8"/><text class="ti" x="340" y="59" text-anchor="middle" dominant-baseline="central">Estimate when the clause is heard</text><text class="su" x="340" y="78" text-anchor="middle" dominant-baseline="central">Playback start + chars before × time per char + pauses</text></g><path class="ln" d="M340 96 L340 120 L150 120 L150 147" marker-end="url(#a)"/><path class="ln" d="M340 96 L340 147" marker-end="url(#a)"/><path class="ln" d="M340 120 L530 120 L530 147" marker-end="url(#a)"/><g class="teal"><rect x="60" y="150" width="180" height="56" rx="8"/><text class="ti" x="150" y="169" text-anchor="middle" dominant-baseline="central">Judgment is early</text><text class="su" x="150" y="188" text-anchor="middle" dominant-baseline="central">Apply at the sound</text></g><g class="teal"><rect x="250" y="150" width="180" height="56" rx="8"/><text class="ti" x="340" y="169" text-anchor="middle" dominant-baseline="central">Arrives mid-clause</text><text class="su" x="340" y="188" text-anchor="middle" dominant-baseline="central">Apply right away</text></g><g class="gray"><rect x="440" y="150" width="180" height="56" rx="8"/><text class="ti" x="530" y="169" text-anchor="middle" dominant-baseline="central">Already passed</text><text class="su" x="530" y="188" text-anchor="middle" dominant-baseline="central">Drop it</text></g><path class="ln" d="M150 206 L150 228 L340 228 L340 247" marker-end="url(#a)"/><path class="ln" d="M340 206 L340 247" marker-end="url(#a)"/><rect class="ct" x="60" y="250" width="560" height="262" rx="16" fill="none" stroke-dasharray="6 4"/><text class="big tx" x="80" y="274" text-anchor="start" dominant-baseline="central">Layer compositing, every frame</text><g class="teal"><rect x="80" y="296" width="520" height="34" rx="6"/><text class="ti" x="100" y="313" dominant-baseline="central">Part actions</text><text class="su" x="230" y="313" dominant-baseline="central">Jev's picks. Brows fast, mouth corners slow</text></g><g class="teal"><rect x="80" y="338" width="520" height="34" rx="6"/><text class="ti" x="100" y="355" dominant-baseline="central">Turn state</text><text class="su" x="230" y="355" dominant-baseline="central">Base pose: listening, thinking, speaking</text></g><g class="teal"><rect x="80" y="380" width="520" height="34" rx="6"/><text class="ti" x="100" y="397" dominant-baseline="central">Gestures</text><text class="su" x="230" y="397" dominant-baseline="central">Nods, head shakes, brow flash when speaking</text></g><g class="teal"><rect x="80" y="422" width="520" height="34" rx="6"/><text class="ti" x="100" y="439" dominant-baseline="central">Lip sync</text><text class="su" x="230" y="439" dominant-baseline="central">While speaking, the mouth follows the sound</text></g><g class="teal"><rect x="80" y="464" width="520" height="34" rx="6"/><text class="ti" x="100" y="481" dominant-baseline="central">Blinks</text><text class="su" x="230" y="481" dominant-baseline="central">Every 2.5–5.5 s, plus subtle head sway</text></g><path class="ln" d="M340 512 L340 549" marker-end="url(#a)"/><g class="purple"><rect x="190" y="552" width="300" height="56" rx="8"/><text class="ti" x="340" y="571" text-anchor="middle" dominant-baseline="central">Expression frame</text><text class="su" x="340" y="590" text-anchor="middle" dominant-baseline="central">Face: ARKit 52 · arm: joint angles</text></g></svg>
