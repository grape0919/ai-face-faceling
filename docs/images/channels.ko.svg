<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img"><title>부위별 수치 판단</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:1}.ln{fill:none;stroke-width:1.5;stroke:#8f877a}.dash{stroke-dasharray:5 4}.key{stroke:#f2b24e}.muted rect{stroke-dasharray:5 4}.tx{fill:#fbf8f2}.mu{fill:#c2b9ab}.am{fill:#f2b24e}.ct{stroke:#4d473f;fill:#232120}.spark{fill:none;stroke:#f2b24e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.code rect{fill:#2a2724;stroke:#4d473f}.code .ti{fill:#fbf8f2}.code .su{fill:#c2b9ab}.ext rect{fill:#33291a;stroke:#f2b24e}.ext .ti{fill:#f2b24e}.ext .su{fill:#e0cfae}.io rect{fill:#1d1b19;stroke:#4d473f}.io .ti{fill:#fbf8f2}.io .su{fill:#c2b9ab}.out rect{fill:#f2b24e;stroke:#f2b24e}.out .ti{fill:#1d1b19}.out .su{fill:#3a2e17}.muted rect{fill:#1d1b19;stroke:#4d473f}.muted .ti{fill:#c2b9ab}.muted .su{fill:#c2b9ab}</style><rect x="0" y="0" width="680" height="700" rx="16" fill="#1d1b19" stroke="none"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="code"><rect x="140" y="40" width="400" height="56" rx="12"/><text class="ti" x="340" y="59" text-anchor="middle" dominant-baseline="central">몸이 적어 둔 부위</text><text class="su" x="340" y="78" text-anchor="middle" dominant-baseline="central">귀 올림 · 왼쪽 눈 감김 · 고개 오른쪽 · … (한 줄씩)</text></g><path class="ln" d="M340 96 L340 133" marker-end="url(#a)"/><rect class="ct" x="60" y="136" width="560" height="122" rx="16" stroke-dasharray="5 4"/><text class="big tx" x="80" y="160" text-anchor="start" dominant-baseline="central">Jev 에 부위마다 두 가지를 묻는다</text><g class="ext"><rect x="80" y="182" width="250" height="56" rx="12"/><text class="ti" x="205" y="201" text-anchor="middle" dominant-baseline="central">얼마나</text><text class="su" x="205" y="220" text-anchor="middle" dominant-baseline="central">점수 0~1</text></g><g class="ext"><rect x="350" y="182" width="250" height="56" rx="12"/><text class="ti" x="475" y="201" text-anchor="middle" dominant-baseline="central">얼마 동안</text><text class="su" x="475" y="220" text-anchor="middle" dominant-baseline="central">다섯 가지 가운데 하나</text></g><path class="ln" d="M340 258 L340 285" marker-end="url(#a)"/><g class="code"><rect x="140" y="288" width="400" height="56" rx="12"/><text class="ti" x="340" y="307" text-anchor="middle" dominant-baseline="central">값 정리</text><text class="su" x="340" y="326" text-anchor="middle" dominant-baseline="central">반대 부위는 빼기 · 바닥 아래 버림 · 다시 펴기</text></g><path class="ln" d="M340 344 L340 371" marker-end="url(#a)"/><rect class="ct" x="60" y="374" width="560" height="220" rx="16" stroke-dasharray="5 4"/><text class="big tx" x="80" y="398" text-anchor="start" dominant-baseline="central">유지 시간대로 재생</text><g class="code"><rect x="80" y="420" width="520" height="28" rx="8"/><path class="spark" transform="translate(96 426)" d="M0 14 L16 14 L21 2 L26 14 L48 14"/><text class="ti" x="160" y="434" dominant-baseline="central">순간</text><text class="su" x="260" y="434" dominant-baseline="central">한 번 하고 끝. 윙크, 끄덕임</text></g><g class="code"><rect x="80" y="454" width="520" height="28" rx="8"/><path class="spark" transform="translate(96 460)" d="M0 14 L10 14 L13 2 L24 2 L27 14 L48 14"/><text class="ti" x="160" y="468" dominant-baseline="central">잠깐</text><text class="su" x="260" y="468" dominant-baseline="central">1~2초</text></g><g class="code"><rect x="80" y="488" width="520" height="28" rx="8"/><path class="spark" transform="translate(96 494)" d="M0 14 L7 14 L10 2 L32 2 L37 14 L48 14"/><text class="ti" x="160" y="502" dominant-baseline="central">말하는 동안</text><text class="su" x="260" y="502" dominant-baseline="central">그 말이 끝나면 사라진다. 감정 표현</text></g><g class="code"><rect x="80" y="522" width="520" height="28" rx="8"/><path class="spark" transform="translate(96 528)" d="M0 14 L5 14 L8 2 L41 2 L44 14 L48 14"/><text class="ti" x="160" y="536" dominant-baseline="central">머무름</text><text class="su" x="260" y="536" dominant-baseline="central">말이 끝난 뒤에도 몇 초 남는 자세</text></g><g class="code"><rect x="80" y="556" width="520" height="28" rx="8"/><path class="spark" transform="translate(96 562)" d="M0 14 L5 14 L8 2 L48 2"/><text class="ti" x="160" y="570" dominant-baseline="central">시킬 때까지</text><text class="su" x="260" y="570" dominant-baseline="central">반대 자세나 "이제 그만"이 올 때까지</text></g><path class="ln" d="M340 594 L340 621" marker-end="url(#a)"/><g class="out"><rect x="140" y="624" width="400" height="56" rx="12"/><text class="ti" x="340" y="643" text-anchor="middle" dominant-baseline="central">프레임의 부위별 값</text><text class="su" x="340" y="662" text-anchor="middle" dominant-baseline="central">그 부위를 가진 리그가 읽어 움직인다</text></g></svg>
