<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img"><title>부위별 수치 판단</title><style>text{font-family:-apple-system,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}.ti{font-size:14px;font-weight:600}.su,.sm{font-size:12px}.big{font-size:14px;font-weight:600}rect{stroke-width:0.6}.ln{fill:none;stroke-width:1.3}.dash{stroke-dasharray:4 3;stroke-width:0.9}.purple rect{fill:#EEEDFE;stroke:#534AB7}.purple .ti{fill:#3C3489}.purple .su{fill:#534AB7}.teal rect{fill:#E1F5EE;stroke:#0F6E56}.teal .ti{fill:#085041}.teal .su{fill:#0F6E56}.gray rect{fill:#F1EFE8;stroke:#5F5E5A}.gray .ti{fill:#444441}.gray .su{fill:#5F5E5A}.ln{stroke:#73726c}.tx{fill:#2C2C2A}.mu{fill:#5F5E5A}.ct{stroke:#B4B2A9}@media (prefers-color-scheme:dark){.purple rect{fill:#3C3489;stroke:#AFA9EC}.purple .ti{fill:#CECBF6}.purple .su{fill:#AFA9EC}.teal rect{fill:#085041;stroke:#5DCAA5}.teal .ti{fill:#9FE1CB}.teal .su{fill:#5DCAA5}.gray rect{fill:#444441;stroke:#B4B2A9}.gray .ti{fill:#D3D1C7}.gray .su{fill:#B4B2A9}.ln{stroke:#9c9a92}.tx{fill:#D3D1C7}.mu{fill:#B4B2A9}.ct{stroke:#5F5E5A}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="teal"><rect x="140" y="40" width="400" height="56" rx="8"/><text class="ti" x="340" y="59" text-anchor="middle" dominant-baseline="central">몸이 적어 둔 부위</text><text class="su" x="340" y="78" text-anchor="middle" dominant-baseline="central">귀 올림 · 왼쪽 눈 감김 · 고개 오른쪽 · … (한 줄씩)</text></g><path class="ln" d="M340 96 L340 133" marker-end="url(#a)"/><rect class="ct" x="60" y="136" width="560" height="122" rx="16" fill="none" stroke-dasharray="6 4"/><text class="big tx" x="80" y="160" text-anchor="start" dominant-baseline="central">Jev 에 부위마다 두 가지를 묻는다</text><g class="purple"><rect x="80" y="182" width="250" height="56" rx="8"/><text class="ti" x="205" y="201" text-anchor="middle" dominant-baseline="central">얼마나</text><text class="su" x="205" y="220" text-anchor="middle" dominant-baseline="central">점수 0~1</text></g><g class="purple"><rect x="350" y="182" width="250" height="56" rx="8"/><text class="ti" x="475" y="201" text-anchor="middle" dominant-baseline="central">얼마 동안</text><text class="su" x="475" y="220" text-anchor="middle" dominant-baseline="central">다섯 가지 가운데 하나</text></g><path class="ln" d="M340 258 L340 285" marker-end="url(#a)"/><g class="teal"><rect x="140" y="288" width="400" height="56" rx="8"/><text class="ti" x="340" y="307" text-anchor="middle" dominant-baseline="central">값 정리</text><text class="su" x="340" y="326" text-anchor="middle" dominant-baseline="central">반대 부위는 빼기 · 바닥 아래 버림 · 다시 펴기</text></g><path class="ln" d="M340 344 L340 371" marker-end="url(#a)"/><rect class="ct" x="60" y="374" width="560" height="220" rx="16" fill="none" stroke-dasharray="6 4"/><text class="big tx" x="80" y="398" text-anchor="start" dominant-baseline="central">유지 시간대로 재생</text><g class="teal"><rect x="80" y="420" width="520" height="28" rx="6"/><text class="ti" x="100" y="434" dominant-baseline="central">순간</text><text class="su" x="200" y="434" dominant-baseline="central">한 번 하고 끝. 윙크, 끄덕임</text></g><g class="teal"><rect x="80" y="454" width="520" height="28" rx="6"/><text class="ti" x="100" y="468" dominant-baseline="central">잠깐</text><text class="su" x="200" y="468" dominant-baseline="central">1~2초</text></g><g class="teal"><rect x="80" y="488" width="520" height="28" rx="6"/><text class="ti" x="100" y="502" dominant-baseline="central">말하는 동안</text><text class="su" x="200" y="502" dominant-baseline="central">그 말이 끝나면 사라진다. 감정 표현</text></g><g class="teal"><rect x="80" y="522" width="520" height="28" rx="6"/><text class="ti" x="100" y="536" dominant-baseline="central">머무름</text><text class="su" x="200" y="536" dominant-baseline="central">말이 끝난 뒤에도 몇 초 남는 자세</text></g><g class="teal"><rect x="80" y="556" width="520" height="28" rx="6"/><text class="ti" x="100" y="570" dominant-baseline="central">시킬 때까지</text><text class="su" x="200" y="570" dominant-baseline="central">반대 자세나 "이제 그만"이 올 때까지</text></g><path class="ln" d="M340 594 L340 621" marker-end="url(#a)"/><g class="teal"><rect x="140" y="624" width="400" height="56" rx="8"/><text class="ti" x="340" y="643" text-anchor="middle" dominant-baseline="central">프레임의 부위별 값</text><text class="su" x="340" y="662" text-anchor="middle" dominant-baseline="central">그 부위를 가진 리그가 읽어 움직인다</text></g></svg>
