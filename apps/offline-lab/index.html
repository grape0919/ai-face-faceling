<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faceling 오프라인 실험</title>
    <style>
      :root {
        --bg: #f4f2ee;
        --panel: #ffffff;
        --ink: #1f2328;
        --muted: #6b7280;
        --line: #d9d6cf;
        --accent: #2f6f5e;
        --accent-ink: #ffffff;
        --stage: #dfe6e2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17191c;
          --panel: #1f2226;
          --ink: #e6e8eb;
          --muted: #9aa1ab;
          --line: #33373d;
          --accent: #5bb39a;
          --accent-ink: #10231d;
          --stage: #2a3230;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 system-ui, 'Malgun Gothic', sans-serif;
      }
      main {
        /* 옆 칸의 글 길이가 바뀌어도 얼굴 화면 크기가 변하지 않도록 칸 너비를 고정한다 */
        display: grid;
        grid-template-columns: minmax(0, 720px) minmax(0, 380px);
        gap: 16px;
        align-items: start;
        padding: 16px;
        max-width: 1180px;
        margin: 0 auto;
      }
      @media (max-width: 720px) {
        main { grid-template-columns: minmax(0, 1fr); }
      }
      #stage {
        width: 100%;
        aspect-ratio: 1;
        background: var(--stage);
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      #stage canvas { width: 100%; height: 100%; display: block; }
      #caption {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        min-height: 2.6em;
      }
      #caption b { color: var(--accent); margin-right: 6px; }
      aside {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      h1 { font-size: 16px; margin: 0 0 2px; }
      h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
      p { margin: 0; color: var(--muted); }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      button, label.file {
        font: inherit;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      button[aria-pressed='true'], button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }
      button:disabled { opacity: 0.5; cursor: default; }
      input[type='file'] { display: none; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      #dims { display: grid; grid-template-columns: 44px 1fr 150px; gap: 3px 8px; align-items: center; font-variant-numeric: tabular-nums; }
      .bar { height: 8px; border-radius: 4px; background: var(--line); position: relative; overflow: hidden; }
      .bar i { position: absolute; top: 0; bottom: 0; background: var(--accent); }
      #status { color: var(--muted); }
      #judged { min-height: 4.5em; margin-top: 8px; }
      #error { color: #c2410c; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <div id="stage">
        <canvas id="canvas" width="720" height="720"></canvas>
        <div id="caption"></div>
      </div>
      <aside>
        <section>
          <h1 id="title">Faceling 오프라인 실험</h1>
          <p id="status">불러오는 중</p>
          <p id="error"></p>
        </section>
        <section>
          <h2>동작 수준</h2>
          <div class="row" id="levels">
            <button data-level="L0" title="오디오만: 립싱크, 턴 상태, 깜빡임">L0 오디오만</button>
            <button data-level="L1" title="AI 가 말하는 구간의 부위별 표정 추가">L1 + 말하는 표정</button>
            <button data-level="L2" title="사용자 발화에 대한 듣기 반응 추가">L2 + 듣기 반응</button>
          </div>
        </section>
        <section>
          <h2>얼굴</h2>
          <div class="row" id="avatars">
            <button data-avatar="faceling" title="코드로 그린 얼굴. ARKit 52개를 모두 반영">페이스링</button>
            <button data-avatar="robot" title="코드로 그린 얼굴. ARKit 52개를 모두 반영">로봇</button>
            <button data-avatar="dog" title="코드로 그린 얼굴. ARKit 52개를 모두 반영">강아지</button>
            <button data-avatar="vrm" title="VRM 모델. 가진 표정만 반영">VRM 모델</button>
            <label class="file">VRM 바꾸기<input id="vrm" type="file" accept=".vrm" /></label>
          </div>
        </section>
        <section>
          <h2>재생</h2>
          <div class="row">
            <button id="play" class="primary">재생</button>
            <button id="record">처음부터 녹화</button>
          </div>
          <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="재생 위치" />
          <p id="clock">0.0 / 0.0초</p>
        </section>
        <section>
          <h2>부위별 동작 (Jev 의 선택 → 얼굴에 걸린 세기)</h2>
          <div id="dims"></div>
          <p id="judged"></p>
          <p id="usage"></p>
        </section>
      </aside>
    </main>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
