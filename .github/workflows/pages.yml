# 녹화 데모(키 없는 정적 페이지)를 GitHub Pages 에 올린다.
# 판단은 저장소에 든 녹화(apps/realtime/public/recordings.json)를 재생하므로 빌드에 키가 필요 없다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 잠금 파일을 Windows 에서 만들어 Linux 용 빌드 도구 바이너리가 빠져 있다(npm 의 알려진 문제).
      # 그래서 잠금 파일 없이 새로 설치한다. 버전은 package.json 의 범위 안에서 정해진다.
      - run: rm package-lock.json && npm install
      - run: npm run rt:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/realtime/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
